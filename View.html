    <script type="text/babel">
      


       function App()
       {
        const [unit, setUnit]=React.useState("metric");
        const [heightMetric, setHeightMetric] = React.useState(180);
        const [weightMetric, setWeightMetric] = React.useState(75);

        const [heightImperial, setHeightImperial] = React.useState({
        feet: 5,
        inches: 11
        });

        const [weightImperial, setWeightImperial] = React.useState({
        stones: 11,
        pounds: 11
       });
       
       const[metricErrors, setMetricErrors]=React.useState({height:"",weight:""});
       const[imperialErrors, setImperialErrors]=React.useState({height:"",weight:""});
       const defaultExplanation="BMI ∈[18.5, 24.9] means you are a healthy weight." 
           +"BMI > 25 means you are overweigt . BMI < 18.5 means you are underwieght";
       const [bmi,setBmi]=React.useState(22.4);
       const[minWeight, setMinWeight]=React.useState(63.3);
       const[maxWeight, setMaxWeight]=React.useState(85.2);
       const[classification, setClassification]=React.useState("a healthy weight"); 
       const[explanation, setExplanation]=React.useState("");
       const controllerRef=React.useRef(null);
       
        if (controllerRef.current === null) {
            const bmiModel = new BMIModel(data);
            
            
            controllerRef.current = new BMIController(bmiModel);
            
        }

        const myController = controllerRef.current;
     
           function makeFirstValidation(){
          
          const bmiAkt=myController.calculateBMI(unit, heightMetric, weightMetric);
          setBmi(bmiAkt);
          const range=myController.calculateHealthyWeightRange();
          setMinWeight(range.min);
          setMaxWeight(range.max);
          myController.setBMI(bmiAkt);
          myController.setBMIData();
          setClassification(myController.getClassification());
          setExplanation(myController.getExplanation());
         
          
        }
         React.useEffect(() => {
        makeFirstValidation();
    }, []);
        
        function handleHeightChangeMetric(event) {
         const value = event.target.value;

         if (myController.containsWrongSymbols(value) || myController.containsNegativeValues(value)) {
              return;
         }

         setHeightMetric(value);
         const newError= myController.controllMetricHeight(value);
         if(newError===""){
          const newBMI=myController.calculateBMI(unit, value, weightMetric);
          setBmi(newBMI);
          myController.setBMI(newBMI);
          myController.setBMIData();
          const newClassification=myController.getClassification();
          const newExplanation=myController.getExplanation();
          const newMinWeight=myController.calculateHealthyWeightRange().min;
          setMinWeight(newMinWeight);
          const newMaxWeight=myController.calculateHealthyWeightRange().max;
          setMaxWeight(newMaxWeight);
          setClassification(newClassification);
          setExplanation(newExplanation);
         }
         else{
           
           setExplanation(defaultExplanation);
         }
         setMetricErrors({
             ...metricErrors,
             "height": newError
             });
        }

        function handleWeightChangeMetric(event) {
          const value = event.target.value;

         if (myController.containsWrongSymbols(value) || myController.containsNegativeValues(value)) {
              return;
         }
           setWeightMetric(value);
           const newError= myController.controllMetricWeight(value);
           if(newError===""){
              console.log(`heightMetric:${heightMetric}; weightMetric:${weightMetric}`);
              const newBMI=myController.calculateBMI(unit, heightMetric, value);
              setBmi(newBMI);
              console.log(`newBmi:${newBMI}`);
              myController.setBMI(newBMI);
              myController.setBMIData();
              const newClassification=myController.getClassification();
              const newExplanation=myController.getExplanation();
              setClassification(newClassification);
              setExplanation(newExplanation);  
              
           }
           else{
            setExplanation(defaultExplanation);
           }
         setMetricErrors({
             ...metricErrors,
             "weight": newError
             });
        }
        function handleHeightChangeImperial(event) {
        const { name, value } = event.target;
        if (myController.containsWrongSymbols(value) || myController.containsNegativeValues(value)) {
              return;
         }
         const newHeightImperial = {
        ...heightImperial,
        [name]: value
       };
         setHeightImperial(newHeightImperial);
          
        const newError= myController.controllImperialHeight(newHeightImperial);
        console.log(`New error height imperial ${newError}`);
        if(newError===""){
          const newBMI=myController.calculateBMI(unit,heightImperial,weightImperial);
          myController.setBMI(newBMI);
              myController.setBMIData();
              const newClassification=myController.getClassification();
              const newExplanation=myController.getExplanation();
              setClassification(newClassification);
              setExplanation(newExplanation);  
        }
        else{
          setExplanation(defaultExplanation);
        }
         setImperialErrors({
        ...imperialErrors,
        height: newError
       });
       
        }

        function handleHeightChangeImperial2(event) {

    console.log("========================================");
    console.log("handleHeightChangeImperial START");

    // 1. Was kommt vom Input?
    const { name, value } = event.target;

    console.log("1. Event:");
    console.log("   name:", name);
    console.log("   value:", value);

    // 2. Aktueller React-State
    console.log("2. Aktueller heightImperial-State:");
    console.log("   feet:", heightImperial.feet);
    console.log("   inches:", heightImperial.inches);

    // 3. Zeichen überprüfen
    const wrongSymbols = myController.containsWrongSymbols(value);
    const negativeValue = myController.containsNegativeValues(value);

    console.log("3. Zeichenprüfung:");
    console.log("   containsWrongSymbols:", wrongSymbols);
    console.log("   containsNegativeValues:", negativeValue);

    if (wrongSymbols || negativeValue) {
        console.log("❌ Eingabe wird abgelehnt");
        console.log("========================================");
        return;
    }

    // 4. Neuer Height-State wird VOR setState gebaut
    const newHeightImperial = {
        ...heightImperial,
        [name]: value
    };

    console.log("4. Neuer heightImperial-Wert:");
    console.log("   feet:", newHeightImperial.feet);
    console.log("   inches:", newHeightImperial.inches);

    // 5. Vergleich alt vs. neu
    console.log("5. Vergleich:");
    console.log("   ALTER State:", heightImperial);
    console.log("   NEUER Wert:", newHeightImperial);

    // 6. State aktualisieren
    setHeightImperial(newHeightImperial);

    console.log("6. setHeightImperial wurde aufgerufen");

    // 7. Jetzt mit dem NEUEN Wert validieren!
    console.log("7. Starte controllImperialHeight mit:");
    console.log(newHeightImperial);

    const newError =
        myController.controllImperialHeight(newHeightImperial);

    console.log("8. Ergebnis controllImperialHeight:");
    console.log("   newError:", newError);

    // 8. Error-State aktualisieren
    setImperialErrors({
        ...imperialErrors,
        height: newError
    });

    console.log("9. imperialErrors wird gesetzt:");
    console.log({
        ...imperialErrors,
        height: newError
    });

    console.log("handleHeightChangeImperial END");
    console.log("========================================");
}

        function handleWeightChangeImperial(event) {
         const { name, value } = event.target;
         if (myController.containsWrongSymbols(value) || myController.containsNegativeValues(value)) {
              return;
         }
         const newWeightImperial = {
        ...weightImperial,
        [name]: value
    };
       console.log(`newWeightImperial:${newWeightImperial}`)
        setWeightImperial(newWeightImperial);
          
        const newError= myController.controllImperialWeight(newWeightImperial);
        if(newError===""){
          const newBMI=myController.calculateBMI(unit,heightImperial,weightImperial);
          myController.setBMI(newBMI);
              myController.setBMIData();
              const newClassification=myController.getClassification();
              const newExplanation=myController.getExplanation();
              setClassification(newClassification);
              setExplanation(newExplanation);  
        }
        else{
          setExplanation(defaultExplanation);
        }
        console.log(`New error weight imperial ${newError}`);
         setImperialErrors({
        ...imperialErrors,
        weight: newError
       });
         
        }
     

        function handleChangeOfUnit(event){
          const newUnit=event.target.value;
          if(newUnit==="metric")
          {
          const bmiAkt=myController.calculateBMI(newUnit, heightMetric, weightMetric);
          setBmi(bmiAkt);
          const range=myController.calculateHealthyWeightRange();
          setMinWeight(range.min);
          setMaxWeight(range.max);
          myController.setBMI(bmiAkt);
          myController.setBMIData();
          setClassification(myController.getClassification());
          setExplanation(myController.getExplanation());
          setHeightImperial({feet:5,inches:5});
          setWeightImperial({stones:11,pounds:11});
          setImperialErrors({height:"", weight:""});
          }
          if(newUnit==="imperial")
          {
          const bmiAkt=myController.calculateBMI(newUnit, heightImperial, weightImperial);
          setBmi(bmiAkt);
          console.log(`bmiAkt=${bmiAkt}`);
          const range=myController.calculateHealthyWeightRange();
          setMinWeight(range.min);
          setMaxWeight(range.max);
          myController.setBMI(bmiAkt);
          myController.setBMIData();
          setClassification(myController.getClassification());
          setExplanation(myController.getExplanation());
          setHeightMetric(170);
          setWeightMetric(75);
          setMetricErrors({height:"", weight:""});
          
          }
          
          setUnit(newUnit);
        }
     return(
          
          <main className={`main-container` }>
          <div className={`upper-part`}>
          <IntroductionComponent logoImg="/starter-code/assets/images/logo.svg"/>         
          <ComputationComponent 
          unit={unit} handleChangeOfUnit={handleChangeOfUnit}
          heightMetric={heightMetric} weightMetric={weightMetric}
          handleHeightChangeMetric={handleHeightChangeMetric}
          handleWeightChangeMetric={handleWeightChangeMetric}
          heightImperial={heightImperial} weightImperial={weightImperial}
          handleHeightChangeImperial={handleHeightChangeImperial}
          handleWeightChangeImperial={handleWeightChangeImperial}
          bmi={bmi} classification={classification}
          minWeight={minWeight} maxWeight={maxWeight} 
          errorsMetric={metricErrors}
          errorsImperial={imperialErrors}
          />  
          </div> 
          <BigImageComponent 
          bigImageLink="/starter-code/assets/images/image-man-eating.webp" /> 
          <ExplanationComponent explanation={explanation} />               
          </main>
         )      
         
       }
      const container = document.querySelector('#root');
      ReactDOM.createRoot(container).render(<App />);
    </script>
